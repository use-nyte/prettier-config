name: PR Policy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read
  issues: read

jobs:
  validate:
    name: Validate PR Title
    uses: use-nyte/.github/.github/workflows/pr-policy.yml@main
    with:
      enforce-linked-issues: true
